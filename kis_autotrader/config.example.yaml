# ============================================================
#  KIS 모의투자 자동매매 설정 파일
#  이 파일을 config.yaml 로 복사한 뒤 값을 채우세요.
#  ⚠ config.yaml 은 절대 다른 사람과 공유하거나 GitHub에 올리지 마세요.
# ============================================================

# --- 인증 정보 (KIS Developers에서 발급받은 "모의투자" 키) ---
app_key: "여기에_모의투자_APP_KEY"
app_secret: "여기에_모의투자_APP_SECRET"

# 모의투자 계좌번호 (예: "50123456-01")  앞 8자리-뒤 2자리
account: "50123456-01"

# 실행 모드: demo(모의투자)만 허용. 실전 전환은 코드에서 막아두었습니다.
mode: "demo"

# --- 매매 대상 종목 (6자리 종목코드) ---
watchlist:
  - "005930"   # 삼성전자
  - "000660"   # SK하이닉스
  - "035420"   # NAVER
  - "005380"   # 현대차

# --- 전략: 이동평균선 크로스 ---
strategy:
  short_ma: 5          # 단기 이동평균 (일)
  long_ma: 20          # 장기 이동평균 (일)
  # entry 방식
  #   cross : 오늘 골든크로스가 "발생"했을 때만 매수 (보수적, 신호 드묾)
  #   trend : 단기선 > 장기선 상태면 매수 (신호 잦음, 테스트용으로 좋음)
  entry: "cross"

# --- 리스크 관리 ---
risk:
  budget_per_stock: 3000000   # 종목당 최대 매수 금액 (원)
  max_positions: 3            # 동시에 보유할 최대 종목 수
  stop_loss_pct: -5.0         # 손절 기준 수익률 (%)
  take_profit_pct: 10.0       # 익절 기준 수익률 (%)

# --- 실행 주기 ---
loop_interval_sec: 300        # 몇 초마다 한 번씩 점검할지 (기본 5분)
market_open: "09:05"          # 이 시각부터 매매 (장 시작 직후 변동성 회피)
market_close: "15:15"         # 이 시각 이후 매매 중단
