<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>소방전기 실기 두문자 암기장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1EE; --panel:#FFFFFF; --ink:#17211C; --muted:#5B6862; --line:#D3DAD5;
  --green:#0A7A45; --red:#C9251D; --red-soft:#FBE7E5; --mark:#FFE7A0; --chip:#E4EAE6; --ok-soft:#DDF1E5;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1512; --panel:#18201C; --ink:#E6ECE8; --muted:#9AA8A1; --line:#2B3630;
    --green:#2FB36E; --red:#E0463D; --red-soft:#3A1F1D; --mark:#5C4B12; --chip:#243029; --ok-soft:#173424;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1512; --panel:#18201C; --ink:#E6ECE8; --muted:#9AA8A1; --line:#2B3630;
  --green:#2FB36E; --red:#E0463D; --red-soft:#3A1F1D; --mark:#5C4B12; --chip:#243029; --ok-soft:#173424;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 80px}
header.top{display:flex;gap:14px;align-items:center;padding:20px 0 12px}
.exit{flex:none;background:var(--green);color:#fff;border-radius:8px;padding:8px 12px;text-align:center;
  font-family:"Black Han Sans",sans-serif;line-height:1.1;min-width:84px}
.exit b{display:block;font-size:28px;font-weight:400}
.exit small{font-family:"IBM Plex Sans KR",sans-serif;font-size:11px;opacity:.9}
h1{font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:clamp(22px,5vw,30px);line-height:1.2;margin:0}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0 10px;border-bottom:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;color:var(--ink);padding:7px 12px;font:inherit;font-size:14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:7px 12px;font:inherit;font-size:14px;cursor:pointer}
input[type=search]{flex:1;min-width:140px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:7px 10px;font:inherit;font-size:14px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-top:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--green);border-color:var(--green);color:#fff}
.tab.quiz{border-color:var(--red);color:var(--red)}
.tab.quiz[aria-selected="true"]{background:var(--red);border-color:var(--red);color:#fff}
.tab .n{opacity:.7;margin-left:4px;font-size:12px}
.progress{font-size:13px;color:var(--muted);margin:14px 0 6px;display:flex;justify-content:space-between;gap:8px}
.meter{height:4px;background:var(--chip);border-radius:4px;overflow:hidden;margin-bottom:14px}
.meter i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}
.sec{font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:19px;margin:26px 0 10px;color:var(--green)}
.sec.q{color:var(--red)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin:0 0 12px}
.card.ok{border-left:4px solid var(--green)}
.card.again{border-left:4px solid var(--red)}
.head{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.card h3{font-size:16px;margin:0;font-weight:700;line-height:1.45}
.tags{display:flex;gap:4px;flex:none}
.tag{font-size:11px;padding:1px 7px;border-radius:4px;background:var(--chip);color:var(--muted);white-space:nowrap}
.tag.hot{background:var(--red-soft);color:var(--red)}
.tag.new{background:var(--green);color:#fff}
.tiles{display:flex;flex-wrap:wrap;gap:10px 14px;margin:12px 0 4px}
.tiles .g{display:inline-flex;gap:3px}
.tiles span{min-width:38px;height:38px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center;
  background:var(--red);color:#fff;border-radius:6px;font-family:"Black Han Sans",sans-serif;font-size:21px;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.mn{margin:8px 0 0;font-size:15px;font-weight:500}
.mn::before{content:"연상  ";color:var(--red);font-size:12px;font-weight:700}
.tip{font-size:13px;color:var(--muted);margin:6px 0 0}
.ans{margin:12px 0 0;padding:0;list-style:none;counter-reset:a}
.ans li{position:relative;padding:5px 0 5px 28px;border-top:1px dashed var(--line);font-size:15px}
.ans li:first-child{border-top:0}
.ans li::before{counter-increment:a;content:counter(a);position:absolute;left:0;top:7px;width:20px;height:20px;border-radius:50%;
  background:var(--chip);color:var(--muted);font-size:11px;display:flex;align-items:center;justify-content:center}
.ans mark,.qt mark{background:var(--mark);color:inherit;font-weight:700;padding:0 2px;border-radius:3px}
.note{margin:10px 0 0;font-size:13px;background:var(--red-soft);color:var(--ink);padding:8px 10px;border-radius:6px}
.src{font-size:12px;color:var(--muted);margin-top:10px}
.hidebox{margin-top:12px}
.reveal{width:100%;border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:12px;font:inherit;font-size:14px;cursor:pointer}
.acts{display:flex;gap:6px;margin-top:12px}
.acts button{flex:1;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:7px;font:inherit;font-size:13px;cursor:pointer}
.acts button[aria-pressed="true"].g{background:var(--green);border-color:var(--green);color:#fff}
.acts button[aria-pressed="true"].r{background:var(--red);border-color:var(--red);color:#fff}
.qt{font-size:16px;line-height:2.1;margin:10px 0 0}
.qt input{width:5.2em;border:0;border-bottom:2px solid var(--ink);background:var(--chip);color:var(--ink);font:inherit;font-weight:700;
  text-align:center;padding:0 4px;border-radius:4px 4px 0 0;margin:0 2px}
.qt input.okk{border-color:var(--green);background:var(--ok-soft)}
.qt input.ng{border-color:var(--red);background:var(--red-soft)}
.qrow{display:flex;gap:6px;margin-top:10px}
.qrow button{flex:1}
.qres{margin-top:8px;font-size:14px}
.qres b{color:var(--red)}
.empty{text-align:center;color:var(--muted);padding:40px 0}
footer{font-size:12px;color:var(--muted);margin-top:30px;line-height:1.7}
button:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="exit" aria-label="시험까지 남은 날"><b id="dday">D-</b><small>11월 7일 실기</small></div>
    <div>
      <h1>소방전기 실기 두문자 암기장</h1>
      <p class="sub">빨간 칸 = 두문자 · 소리 내어 읽고 연상 문장으로 붙이기</p>
    </div>
  </header>

  <div class="bar">
    <div class="row">
      <div class="seg" role="group" aria-label="보기 방식">
        <button id="mStudy" aria-pressed="true">보면서 외우기</button>
        <button id="mHide" aria-pressed="false">가리고 떠올리기</button>
      </div>
      <div class="seg" role="group" aria-label="카드 거르기">
        <button data-f="all" aria-pressed="true">전체</button>
        <button data-f="hot" aria-pressed="false">빈출</button>
        <button data-f="again" aria-pressed="false">다시 볼 것</button>
      </div>
    </div>
    <div class="row" style="margin-top:8px">
      <input type="search" id="q" placeholder="검색 (예: 종단저항, 20분)">
      <button class="btn" id="shuffle">섞기</button>
    </div>
    <div class="tabs" id="tabs" role="tablist"></div>
  </div>

  <div class="progress"><span id="ptext"></span><span id="ctext"></span></div>
  <div class="meter"><i id="pbar"></i></div>
  <main id="list"></main>

  <footer>
    숫자 단답형은 '가리고 떠올리기'에서 빈칸에 숫자만 입력하고 채점하세요 (단위·쉼표는 생략해도 됩니다).
    기준: 화재안전기술기준(NFTC) 현행본, 자동화재탐지설비는 2026.3.1 시행 개정 반영.
    2026.5.4 개정 고시(NFPC 201·205·304·504·505·602)의 세부 변경은 법령정보센터에서 한 번 더 확인하세요.
    체크 기록은 이 기기 브라우저에만 저장됩니다.
  </footer>
</div>

const PARTS = [

 {s:"고층건축물", q:"비상전원: 30~49층은 {40}분, 50층 이상은 {60}분 이상"}

const KEY="fire-elec-memo-v1";
let marks={}; try{marks=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){marks={}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(marks))}catch(e){}};
let ui={mode:"study",filter:"all",part:-1,q:"",order:null,open:{},graded:{}};
try{const u=JSON.parse(localStorage.getItem(KEY+"-ui")||"{}");ui.mode=u.mode||"study";ui.part=(u.part??-1)}catch(e){}
const saveUi=()=>{try{localStorage.setItem(KEY+"-ui",JSON.stringify({mode:ui.mode,part:ui.part}))}catch(e){}};

const ALL=[];PARTS.forEach((p,pi)=>p.items.forEach((it,ii)=>{it.id=(p.quiz?"q":"c")+pi+"-"+ii;it.pi=pi;it.quiz=!!p.quiz;
  if(it.quiz){it.t=it.s;it.a=[]}ALL.push(it)}));
if(ui.part>=PARTS.length)ui.part=-1;
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const hl=s=>esc(s).replace(/\[([^\]]+)\]/g,"<mark>$1</mark>");
const plain=s=>String(s).replace(/[\[\]{}]/g,"");
const isHan=s=>/^[가-힣]+$/.test(s);
function groups(d){if(!d)return[];if(Array.isArray(d))return d.map(x=>[x]);
  return d.split(" ").filter(Boolean).map(g=>isHan(g)?[...g]:[g]);}
const norm=s=>String(s).replace(/[^0-9.~\-]/g,"").replace(/^0+(?=\d)/,"");
const blanks=q=>[...q.matchAll(/\{([^}]+)\}/g)].map(m=>m[1]);

(function(){const t=new Date();t.setHours(0,0,0,0);const e=new Date(2026,10,7);const n=Math.round((e-t)/864e5);
 document.getElementById("dday").textContent=n>0?"D-"+n:(n===0?"D-DAY":"D+"+(-n));})();

function visible(){
  const q=ui.q.trim().toLowerCase();
  let list=ALL.filter(it=>(ui.part<0||it.pi===ui.part)
    &&(ui.filter!=="hot"||it.hot)&&(ui.filter!=="again"||marks[it.id]==="again")
    &&(!q||((it.t||"")+" "+(it.q?plain(it.q):"")+" "+(typeof it.d==="string"?it.d:(it.d||[]).join(""))+" "+it.a.map(plain).join(" ")+" "+(it.mn||"")+" "+(it.tip||"")).toLowerCase().includes(q)));
  if(ui.order){const pos={};ui.order.forEach((id,i)=>pos[id]=i);list=list.slice().sort((a,b)=>(pos[a.id]??0)-(pos[b.id]??0))}
  return list;
}
function renderTabs(){
  const el=document.getElementById("tabs");
  const opts=[{i:-1,name:"전체",n:ALL.length}].concat(PARTS.map((p,i)=>({i,name:p.name,n:p.items.length,quiz:p.quiz})));
  el.innerHTML=opts.map(o=>`<button class="tab${o.quiz?" quiz":""}" role="tab" data-p="${o.i}" aria-selected="${ui.part===o.i}">${esc(o.name)}<span class="n">${o.n}</span></button>`).join("");
}
function acts(it){const m=marks[it.id]||"";
  return `<div class="acts"><button class="g" data-act="ok" aria-pressed="${m==="ok"}">외웠음</button><button class="r" data-act="again" aria-pressed="${m==="again"}">다시 볼 것</button></div>`}
function quizCard(it){
  const m=marks[it.id]||"";const hide=ui.mode==="hide";
  let h=`<article class="card ${m}" data-id="${it.id}"><div class="head"><h3>${esc(it.s)}</h3><div class="tags">${it.hot?'<span class="tag hot">빈출</span>':""}</div></div>`;
  const parts=it.q.split(/\{[^}]+\}/);const ans=blanks(it.q);
  let qt="";parts.forEach((p,i)=>{qt+=esc(p);if(i<ans.length){qt+=hide?`<input inputmode="decimal" autocomplete="off" aria-label="빈칸 ${i+1}" data-i="${i}">`:`<mark>${esc(ans[i].split("|")[0])}</mark>`}});
  h+=`<p class="qt">${qt}</p>`;
  if(hide)h+=`<div class="qrow"><button class="btn" data-act="grade">채점</button><button class="btn" data-act="show">정답 보기</button></div><div class="qres" aria-live="polite"></div>`;
  return h+acts(it)+`</article>`;
}
function card(it){
  if(it.quiz)return quizCard(it);
  const m=marks[it.id]||"";const hide=ui.mode==="hide"&&!ui.open[it.id];
  const gs=groups(it.d);
  let h=`<article class="card ${m}" data-id="${it.id}"><div class="head"><h3>${esc(it.t)}</h3><div class="tags">`;
  if(it.isNew)h+=`<span class="tag new">2026 개정</span>`;
  if(it.hot)h+=`<span class="tag hot">빈출</span>`;
  h+=`</div></div>`;
  if(gs.length)h+=`<div class="tiles" aria-label="두문자">${gs.map(g=>`<span class="g">${g.map(c=>`<span>${esc(c)}</span>`).join("")}</span>`).join("")}</div>`;
  if(it.mn)h+=`<p class="mn">${esc(it.mn)}</p>`;
  if(hide){h+=`<div class="hidebox"><button class="reveal" data-act="open">떠올린 뒤 눌러서 정답 확인</button></div>`}
  else{
    if(it.tip)h+=`<p class="tip">${esc(it.tip)}</p>`;
    h+=`<ol class="ans">${it.a.map(x=>`<li>${hl(x)}</li>`).join("")}</ol>`;
    if(it.note)h+=`<p class="note">⚠ ${esc(it.note)}</p>`;
    h+=`<div class="src">근거: ${esc(it.src||"")}</div>`;
  }
  return h+acts(it)+`</article>`;
}
function render(){
  renderTabs();
  document.getElementById("mStudy").setAttribute("aria-pressed",ui.mode==="study");
  document.getElementById("mHide").setAttribute("aria-pressed",ui.mode==="hide");
  document.querySelectorAll("[data-f]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.f===ui.filter));
  const list=visible();const main=document.getElementById("list");
  const scope=ui.part<0?ALL:PARTS[ui.part].items;const ok=scope.filter(i=>marks[i.id]==="ok").length;
  document.getElementById("ptext").textContent=`${ui.part<0?"전체":PARTS[ui.part].name} · 외움 ${ok} / ${scope.length}`;
  document.getElementById("ctext").textContent=`다시 볼 것 ${scope.filter(i=>marks[i.id]==="again").length}`;
  document.getElementById("pbar").style.width=(scope.length?ok/scope.length*100:0)+"%";
  if(!list.length){main.innerHTML=`<p class="empty">${ui.filter==="again"?"다시 볼 카드가 없습니다. 카드에서 '다시 볼 것'을 누르면 여기에 모입니다.":"조건에 맞는 카드가 없습니다. 검색어나 거르기를 바꿔 보세요."}</p>`;return}
  let html="",last=null;
  list.forEach(it=>{if(ui.part<0&&!ui.order&&it.pi!==last){html+=`<h2 class="sec${PARTS[it.pi].quiz?" q":""}">${esc(PARTS[it.pi].name)}</h2>`;last=it.pi}html+=card(it)});
  main.innerHTML=html;
}
function grade(cardEl,it,reveal){
  const ans=blanks(it.q);const ins=cardEl.querySelectorAll(".qt input");let right=0;
  ins.forEach((inp,i)=>{const acc=ans[i].split("|").map(norm);const v=norm(inp.value);
    if(reveal){if(!acc.includes(v))inp.value=ans[i].split("|")[0];inp.classList.remove("ng");inp.classList.add("okk");return}
    const ok=v!==""&&acc.includes(v);inp.classList.toggle("okk",ok);inp.classList.toggle("ng",!ok);if(ok)right++;});
  const res=cardEl.querySelector(".qres");
  if(reveal){res.innerHTML="정답을 채웠습니다. 한 번 소리 내어 읽어 보세요.";return}
  if(right===ans.length){res.innerHTML="모두 정답입니다.";}
  else{res.innerHTML=`${ans.length}개 중 ${right}개 정답 · 정답: <b>${ans.map(a=>esc(a.split("|")[0])).join(", ")}</b>`;}
}
document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest("[data-p]");if(!b)return;ui.part=+b.dataset.p;ui.order=null;saveUi();render();window.scrollTo({top:0})});
document.getElementById("mStudy").onclick=()=>{ui.mode="study";ui.open={};saveUi();render()};
document.getElementById("mHide").onclick=()=>{ui.mode="hide";ui.open={};saveUi();render()};
document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{ui.filter=b.dataset.f;render()});
document.getElementById("q").addEventListener("input",e=>{ui.q=e.target.value;render()});
document.getElementById("shuffle").onclick=()=>{const ids=visible().map(i=>i.id);for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}ui.order=ids;render()};
const byId={};ALL.forEach(i=>byId[i.id]=i);
document.getElementById("list").addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const cardEl=b.closest(".card");const id=cardEl.dataset.id;const a=b.dataset.act;
  if(a==="grade"){grade(cardEl,byId[id],false);return}
  if(a==="show"){grade(cardEl,byId[id],true);return}
  if(a==="open"){ui.open[id]=1;render();return}
  marks[id]=marks[id]===a?undefined:a;if(!marks[id])delete marks[id];save();
  cardEl.classList.remove("ok","again");if(marks[id])cardEl.classList.add(marks[id]);
  cardEl.querySelectorAll(".acts button").forEach(x=>x.setAttribute("aria-pressed",marks[id]===x.dataset.act));
  const scope=ui.part<0?ALL:PARTS[ui.part].items;const ok=scope.filter(i=>marks[i.id]==="ok").length;
  document.getElementById("ptext").textContent=`${ui.part<0?"전체":PARTS[ui.part].name} · 외움 ${ok} / ${scope.length}`;
  document.getElementById("ctext").textContent=`다시 볼 것 ${scope.filter(i=>marks[i.id]==="again").length}`;
  document.getElementById("pbar").style.width=(scope.length?ok/scope.length*100:0)+"%";
});
document.getElementById("list").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.matches(".qt input")){const c=e.target.closest(".card");grade(c,byId[c.dataset.id],false)}});
render();
</script>
